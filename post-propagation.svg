<path d="M 292 191 H 414" stroke="#2563eb" stroke-width="3"/><path d="M 414 191 L 400 183 L 400 199 Z" fill="#2563eb"/>
<text x="353.0" y="170" font-size="19" fill="#2563eb" font-weight="700" text-anchor="middle">1. 伝播</text>
<path d="M 666 191 H 788" stroke="#2563eb" stroke-width="3"/><path d="M 788 191 L 774 183 L 774 199 Z" fill="#2563eb"/>
<text x="727.0" y="170" font-size="19" fill="#2563eb" font-weight="700" text-anchor="middle">2. 伝播</text>
<text x="540" y="300" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">新規投稿は、接続先へ自動で伝播する</text>
<text x="540" y="359" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">A–B、B–Cが接続している場合の例です。受信した投稿は各ブラウザに保存します。</text>
</g></svg>
