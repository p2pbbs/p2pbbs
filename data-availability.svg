<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1110" viewBox="0 0 1080 1110" role="img" aria-labelledby="title desc">
<title id="title">過去ログの伝播パターン</title><desc id="desc">1. 過去ログを持たない自分のブラウザが新規接続すると、参加者Aから伝播する。2. 過去ログを持つ参加者A・Bが全員オフラインだと、自分のブラウザへ伝播しない。3. レス1〜5を持つ参加者Aがオフラインからオンラインに戻ると、レス1〜3を持つ自分のブラウザへ未受信のレス4〜5だけが差分として伝播する。</desc>
<rect width="1080" height="1110" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, &apos;Hiragino Sans&apos;, &apos;Noto Sans CJK JP&apos;, &apos;Yu Gothic&apos;, sans-serif">
<text x="24" y="39" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">過去ログの伝播パターン</text>
<rect x="24" y="68" width="1032" height="274" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<circle cx="58" cy="105" r="17" fill="#334155"/>
<text x="58" y="112" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="87" y="113" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">過去ログを持たない状態で新規接続する</text>
<g>
<rect x="60" y="151" width="240" height="132" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<path d="M 60 178 H 300" stroke="#2563eb" stroke-width="2"/>
<circle cx="75" cy="165" r="3" fill="#2563eb"/>
<circle cx="87" cy="165" r="3" fill="#2563eb"/>
<circle cx="99" cy="165" r="3" fill="#2563eb"/>
<text x="180.0" y="208" font-size="21" fill="#0f172a" font-weight="700" text-anchor="middle">自分のブラウザ</text>
<rect x="85.0" y="221" width="190" height="30" rx="5" fill="#dbeafe"/>
<text x="180.0" y="242" font-size="17" fill="#1d4ed8" font-weight="700" text-anchor="middle">過去ログなし → あり</text>
<text x="180.0" y="271" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">接続前 → 伝播後</text>
</g>
<g>
<rect x="800" y="151" width="220" height="132" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<path d="M 800 178 H 1020" stroke="#2563eb" stroke-width="2"/>
<circle cx="815" cy="165" r="3" fill="#2563eb"/>
<circle cx="827" cy="165" r="3" fill="#2563eb"/>
<circle cx="839" cy="165" r="3" fill="#2563eb"/>
<text x="910.0" y="208" font-size="21" fill="#0f172a" font-weight="700" text-anchor="middle">参加者A</text>
<rect x="855.0" y="221" width="110" height="30" rx="5" fill="#dbeafe"/>
<text x="910.0" y="242" font-size="17" fill="#1d4ed8" font-weight="700" text-anchor="middle">過去ログあり</text>
<text x="910.0" y="271" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">オンライン</text>
</g>
<path d="M 782 213 H 318" stroke="#2563eb" stroke-width="3"/>
<path d="M 318 213 L 332 205 L 332 221 Z" fill="#2563eb"/>
<text x="550" y="192" font-size="19" fill="#2563eb" font-weight="700" text-anchor="middle">接続相手から伝播する</text>
<text x="540" y="320" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">新規接続した自分のブラウザへ、参加者Aから過去ログが自動で伝播する</text>
<rect x="24" y="362" width="1032" height="274" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<circle cx="58" cy="399" r="17" fill="#334155"/>
<text x="58" y="406" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="87" y="407" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">過去ログを持つ参加者が全員ネットワークから離脱している</text>
<g>
<rect x="60" y="445" width="240" height="132" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<path d="M 60 472 H 300" stroke="#2563eb" stroke-width="2"/>
<circle cx="75" cy="459" r="3" fill="#2563eb"/>
<circle cx="87" cy="459" r="3" fill="#2563eb"/>
<circle cx="99" cy="459" r="3" fill="#2563eb"/>
<text x="180.0" y="502" font-size="21" fill="#0f172a" font-weight="700" text-anchor="middle">自分のブラウザ</text>
<rect x="115.0" y="515" width="130" height="30" rx="5" fill="#dbeafe"/>
<text x="180.0" y="536" font-size="17" fill="#1d4ed8" font-weight="700" text-anchor="middle">過去ログなし</text>
<text x="180.0" y="565" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">オンライン</text>
</g>
<g>
<rect x="570" y="445" width="210" height="132" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 570 472 H 780" stroke="#94a3b8" stroke-width="2"/>
<circle cx="585" cy="459" r="3" fill="#94a3b8"/>
<circle cx="597" cy="459" r="3" fill="#94a3b8"/>
<circle cx="609" cy="459" r="3" fill="#94a3b8"/>
<text x="675.0" y="502" font-size="21" fill="#64748b" font-weight="700" text-anchor="middle">参加者A</text>
<rect x="620.0" y="515" width="110" height="30" rx="5" fill="#f1f5f9"/>
<text x="675.0" y="536" font-size="17" fill="#64748b" font-weight="700" text-anchor="middle">過去ログあり</text>
<text x="675.0" y="565" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">オフライン</text>
</g>
<g>
<rect x="810" y="445" width="210" height="132" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 810 472 H 1020" stroke="#94a3b8" stroke-width="2"/>
<circle cx="825" cy="459" r="3" fill="#94a3b8"/>
<circle cx="837" cy="459" r="3" fill="#94a3b8"/>
<circle cx="849" cy="459" r="3" fill="#94a3b8"/>
<text x="915.0" y="502" font-size="21" fill="#64748b" font-weight="700" text-anchor="middle">参加者B</text>
<rect x="860.0" y="515" width="110" height="30" rx="5" fill="#f1f5f9"/>
<text x="915.0" y="536" font-size="17" fill="#64748b" font-weight="700" text-anchor="middle">過去ログあり</text>
<text x="915.0" y="565" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">オフライン</text>
</g>
<path d="M 552 507 H 318" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M 426 498 L 444 516 M 444 498 L 426 516" stroke="#b45309" stroke-width="3.5"/>
<text x="435" y="486" font-size="19" fill="#64748b" font-weight="700" text-anchor="middle">伝播しない</text>
<text x="540" y="614" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">参加者A・Bがオフラインのため、自分のブラウザへ過去ログが伝播しない</text>
<rect x="24" y="656" width="1032" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<circle cx="58" cy="693" r="17" fill="#334155"/>
<text x="58" y="700" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="87" y="701" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">再接続した参加者から過去ログを受け取る</text>
<g>
<rect x="800" y="739" width="220" height="100" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 800 761 H 1020" stroke="#94a3b8" stroke-width="2"/>
<circle cx="815" cy="750" r="3" fill="#94a3b8"/>
<circle cx="827" cy="750" r="3" fill="#94a3b8"/>
<circle cx="839" cy="750" r="3" fill="#94a3b8"/>
<text x="910" y="786" font-size="21" fill="#64748b" font-weight="700" text-anchor="middle">参加者A</text>
<text x="910" y="810" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">レス1〜5を保持</text>
<text x="910" y="829" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">オフライン</text>
</g>
<path d="M 910 849 V 879" stroke="#334155" stroke-width="2.5"/>
<path d="M 910 879 L 903 867 L 917 867 Z" fill="#334155"/>
<text x="932" y="870" font-size="17" fill="#334155" font-weight="700" text-anchor="start">再接続</text>
<g>
<rect x="60" y="895" width="240" height="132" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<path d="M 60 922 H 300" stroke="#2563eb" stroke-width="2"/>
<circle cx="75" cy="909" r="3" fill="#2563eb"/>
<circle cx="87" cy="909" r="3" fill="#2563eb"/>
<circle cx="99" cy="909" r="3" fill="#2563eb"/>
<text x="180.0" y="952" font-size="21" fill="#0f172a" font-weight="700" text-anchor="middle">自分のブラウザ</text>
<rect x="90.0" y="965" width="180" height="30" rx="5" fill="#dbeafe"/>
<text x="180.0" y="986" font-size="17" fill="#1d4ed8" font-weight="700" text-anchor="middle">レス1〜3 → 1〜5</text>
<text x="180.0" y="1015" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">伝播前 → 伝播後</text>
</g>
<g>
<rect x="800" y="895" width="220" height="132" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<path d="M 800 922 H 1020" stroke="#2563eb" stroke-width="2"/>
<circle cx="815" cy="909" r="3" fill="#2563eb"/>
<circle cx="827" cy="909" r="3" fill="#2563eb"/>
<circle cx="839" cy="909" r="3" fill="#2563eb"/>
<text x="910.0" y="952" font-size="21" fill="#0f172a" font-weight="700" text-anchor="middle">参加者A</text>
<rect x="830.0" y="965" width="160" height="30" rx="5" fill="#dbeafe"/>
<text x="910.0" y="986" font-size="17" fill="#1d4ed8" font-weight="700" text-anchor="middle">レス1〜5を保持</text>
<text x="910.0" y="1015" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">オンライン</text>
</g>
<path d="M 782 957 H 318" stroke="#2563eb" stroke-width="3"/>
<path d="M 318 957 L 332 949 L 332 965 Z" fill="#2563eb"/>
<text x="550" y="936" font-size="19" fill="#2563eb" font-weight="700" text-anchor="middle">未受信の投稿が差分として伝播する</text>
<text x="550" y="988" font-size="17" fill="#2563eb" font-weight="400" text-anchor="middle">レス4〜5（差分同期）</text>
<text x="540" y="1064" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">参加者Aがオンラインに戻ると、自分のブラウザへレス4〜5だけが自動で伝播する</text>
</g></svg>
